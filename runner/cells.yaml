# runner/cells.yaml
#
# THE EXPERIMENTAL MATRIX.
#
# Design: ANCHOR + SLICE, not full factorial. Full factorial would be
# 6 conditions x N backbones x 10 convs = weeks of wall time.
#   ANCHOR: every defense condition on ONE backbone, over enough
#     conversations for confidence intervals -> Figure 1 frontier.
#   SLICE: a few representative conditions on another lab's backbone,
#     to test whether the frontier's SHAPE generalises across providers.
#
# Every backbone here MUST exist as an alias in proxy/config.yaml AND in
# proxy/logger.py PRICES, or its calls log cost_usd = 0.0 and the cost
# axis silently breaks for that backbone.

backbones:
  anchor: answering            # gpt-4o-mini, via the proxy alias
  anchor_gemini: gemini-backbone   # gemini-3.1-flash-lite (proxy/config.yaml)
  slice:
    - claude-backbone          # Anthropic
  # Gemini/DeepSeek omitted: no API keys. Adding a lab later means adding
  # the alias to proxy/config.yaml, its price to proxy/logger.py PRICES,
  # and its name here -- nothing else changes.

# The judge is not configured here: core/judge.py hardcodes the
# "judge-claude" alias (claude-haiku-4-5-20251001, kappa=0.909). The old
# "judge: judge" (gpt-4o) entry was never read and has been removed.

conditions:
  - name: none
    defenses: []
  - name: sanitize
    defenses: [sanitize]
  - name: provenance
    defenses: [provenance]
  - name: anomaly
    defenses: [anomaly]
  - name: rerank
    defenses: [rerank]
  - name: stacked
    defenses: [sanitize, provenance, anomaly, rerank]

# Spans the three cost profiles: baseline, no-LLM write-time, LLM read-time.
slice_conditions: [none, sanitize, rerank]

runs:
  anchor:
    backbone: anchor
    conditions: all
    conversations: [0, 1, 2, 3, 4]
  # Second full anchor on a different provider. SAME protocol -- same
  # turns, same evidence filter, same conversations, same Anthropic
  # judge -- so the two tables are comparable to each other. Note the
  # capability gap: gemini-3.1-flash-lite is a newer generation than
  # gpt-4o-mini, so differences reflect model capability as well as
  # provider. Disclose this in the paper. Every model call in these
  # cells -- extraction, answer, anomaly and rerank verdicts -- runs on
  # the backbone; only the judge and the embedder differ.
  anchor_gemini:
    backbone: anchor_gemini
    conditions: all
    conversations: [0, 1, 2, 3, 4]
  # Slice disabled (no runs: entry). Mem0Adapter and the defenses now
  # take the backbone per cell, so enabling it needs only a runs: entry
  # and a re-check with scripts/check_backbones.py.

# Benign only. The adversarial condition needs Component 7 (attack
# module); until then this measures the COST axis, not protection.
condition_type: benign
