# proxy/config.yaml
#
# Model aliases: every part of the project (adapters, judge, defenses)
# requests "answering", "judge", "embedding", or a backbone alias --
# never a raw model name. To swap a model later, change ONE line here.
#
# NOTE: the callback path is "logger.metering_logger", NOT
# "proxy.logger.metering_logger". litellm resolves it relative to the
# folder containing this file.

model_list:
  - model_name: answering
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: judge
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Cross-lab backbone for the slice runs (Anthropic).
  - model_name: claude-backbone
    litellm_params:
      # claude-sonnet-5 rejects `temperature` (deprecated for that model).
      # Using sonnet-4.5, which still accepts temperature=0 -- required
      # to keep the project's determinism invariant across backbones.
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY


  # Cross-provider judge candidate. Judging with a different PROVIDER
  # (not just a different model) is a stronger control against
  # self-preference than OpenAI-judges-OpenAI.
  - model_name: judge-claude
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY


  # Second anchor backbone (Google). Flash tier, chosen as the
  # like-for-like counterpart to gpt-4o-mini rather than a stronger
  # model, so the two tables compare defenses and not model capability.
  - model_name: gemini-backbone
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GOOGLE_API_KEY

litellm_settings:
  callbacks: ["logger.metering_logger"]
  drop_params: true
  set_verbose: false
  # NO RETRIES IN THE PROXY (2026-10-31). Every retry goes through the
  # caller's core/retry.call_with_retry, which counts it, so the
  # integrity check can reconcile ok-call counts. Before this, litellm's
  # router retried twice by default and timed out after 6000 s: in
  # stacked conv0 v3c it timed out a request the client had abandoned
  # and retried it on its own 79 minutes later (an extra ok row).
  # The timeout is above the slowest ok call ever logged (110 s,
  # extraction) and below the clients' (core/proxy_client.py, 360 s),
  # so the proxy always answers first.
  request_timeout: 300
  num_retries: 0

router_settings:
  num_retries: 0
  timeout: 300
